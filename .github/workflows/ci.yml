
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/marinoellebh/inventory-ai-agent:latest .

      - name: Push Docker image
        run: docker push ghcr.io/marinoellebh/inventory-ai-agent:latest

  deploy:
    needs: test
    runs-on: [self-hosted, portfolio-deploy]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check Docker on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 ghcr.io/marinoellebh/inventory-ai-agent:latest

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $envFile = "C:\Users\Pc\Downloads\EECE430_Assignment3_Final\inventory\.env"

          if (-not (Test-Path $envFile)) {
            throw "Local .env file not found."
          }

          docker volume inspect inventory-db
          if ($LASTEXITCODE -ne 0) {
            throw "Database volume inventory-db not found."
          }

          docker run --rm -v inventory-db:/data alpine:3.20 test -f /data/db.sqlite3
          if ($LASTEXITCODE -ne 0) {
            throw "SQLite database missing from volume."
          }

          $existing = docker ps -aq --filter "name=^/inventory-ai-agent-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($existing) {
            docker rm -f inventory-ai-agent-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name inventory-ai-agent-app -p 127.0.0.1:8000:8000 --env-file "$envFile" -e SQLITE_PATH=/app/data/db.sqlite3 -v inventory-db:/app/data ghcr.io/marinoellebh/inventory-ai-agent:latest

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker exec inventory-ai-agent-app python manage.py migrate --noinput
          exit $LASTEXITCODE
